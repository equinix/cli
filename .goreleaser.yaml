# This is an example goreleaser.yaml file with some sane defaults.
# Make sure to check the documentation at http://goreleaser.com
version: 2

before:
  hooks:
    - go mod tidy
    - sh -c 'mkdir -p completions && for shell in bash zsh fish; do go run . completion "$shell" > "completions/equinix.$shell"; done'
builds:
  - main: ./main.go
    env:
      - CGO_ENABLED=0
    binary: equinix
    ldflags:
      - -s -w -X github.com/equinix/cli/internal/version.Version={{.Version}}

    goos:
      - freebsd
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - 'zip'
    name_template: "equinix-{{ .Os }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    files:
      - LICENSE
      - completions/*
checksum:
  name_template: "equinix_{{ .Version }}_checksums.txt"
release:
  mode: "keep-existing"

homebrew_casks:
  - name: equinix
    homepage: "https://docs.equinix.com/"
    description: "Official Equinix CLI"
    license: "MIT"
    completions:
      bash: completions/equinix.bash
      zsh: completions/equinix.zsh
      fish: completions/equinix.fish
    commit_msg_template: "Brew formula update for equinix version {{ .Tag }}"
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/equinix"]
          end
    repository:
      owner: equinix
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
